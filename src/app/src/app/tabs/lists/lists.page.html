<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Lists Component</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lists Component</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-list-header>
      <ion-label>Student List</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-avatar slot="start">
        <ion-icon name="person-circle-outline" style="font-size: 32px;"></ion-icon>
      </ion-avatar>
      <ion-label>
        <h2>Item Title 1</h2>
        <p>Subtitle or description here</p>
      </ion-label>
      <ion-note slot="end">Active</ion-note>
    </ion-item>

    <ion-item>
      <ion-avatar slot="start">
        <ion-icon name="person-circle-outline" style="font-size: 32px;"></ion-icon>
      </ion-avatar>
      <ion-label>
        <h2>Item Title 2</h2>
        <p>Subtitle or description here</p>
      </ion-label>
      <ion-note slot="end">Pending</ion-note>
    </ion-item>

    <ion-item>
      <ion-avatar slot="start">
        <ion-icon name="person-circle-outline" style="font-size: 32px;"></ion-icon>
      </ion-avatar>
      <ion-label>
        <h2>Item Title 3</h2>
        <p>Subtitle or description here</p>
      </ion-label>
      <ion-note slot="end">Inactive</ion-note>
    </ion-item>
  </ion-list>
</ion-content>
